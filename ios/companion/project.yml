name: TraceMemoRemote
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TraceMemoRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TraceMemoRemote
    info:
      path: TraceMemoRemote/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wxauto.TraceMemoRemote
        PRODUCT_NAME: TraceMemoRemote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TraceMemoRemote/Info.plist
        CLANG_ENABLE_MODULES: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_OBJC_ARC: YES
