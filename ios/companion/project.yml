name: TraceMemoRemote
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TraceMemoRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TraceMemoRemote
    resources:
      - path: TraceMemoRemote/Assets.xcassets
      - path: TraceMemoRemote/LaunchScreen.storyboard
    info:
      path: TraceMemoRemote/Info.plist
      properties:
        CFBundleDisplayName: TraceMemo 控制台
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于连接同一局域网中的 Mac 自动回复服务。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).TRSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wxauto.TraceMemoRemote
        PRODUCT_NAME: TraceMemoRemote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TraceMemoRemote/Info.plist
        CLANG_ENABLE_MODULES: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_OBJC_ARC: YES
